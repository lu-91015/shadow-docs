# 顶部导航数据（在 default.html / doc.html 中通过 site.data.navigation.sections 引用）
#
# 每个 section = 顶部一个分区 tab：
#   title    : tab 显示名
#   landing  : 点击 tab 跳转的 landing 页（通常是该区第一页/总览页）
#   prefixes : 该分区覆盖的 url 前缀；用于判定「当前页属于哪个分区」
#              （顶栏 tab 高亮 + 左栏渲染该区目录）；也用于把未显式列入
#              pages 的子页（如 /api/builtins/...）自动归属到本区。
#   pages    : 左栏显示的页面列表（title + url）；命中 prefixes 但未列入
#              的当前页会自动追加为「当前页」项，保证深链可导航。
# 顺序 = 本文件书写顺序（模板不做 sort）。

sections:
  - title: "入门"
    landing: /getting-started/
    prefixes:
      - /about/
      - /install/
      - /getting-started/
    pages:
      - { title: "关于 shadow", url: /about/ }
      - { title: "安装 shadow", url: /install/ }
      - { title: "快速开始", url: /getting-started/ }

  - title: "语言"
    landing: /syntax/
    prefixes:
      - /syntax/
      - /types/
      - /control-flow/
      - /functions/
      - /structs/
      - /enums/
      - /pattern-matching/
      - /error-handling/
      - /modules/
      - /package-manager/
    pages:
      - { title: "语法基础", url: /syntax/ }
      - { title: "类型系统", url: /types/ }
      - { title: "控制流", url: /control-flow/ }
      - { title: "函数与闭包", url: /functions/ }
      - { title: "结构体", url: /structs/ }
      - { title: "枚举", url: /enums/ }
      - { title: "模式匹配", url: /pattern-matching/ }
      - { title: "错误处理", url: /error-handling/ }
      - { title: "模块系统", url: /modules/ }
      - { title: "包管理（SPK）", url: /package-manager/ }

  - title: "库参考"
    landing: /api/
    prefixes:
      - /api/
    pages:
      - { title: "库参考总览", url: /api/ }

  - title: "工具链"
    landing: /toolchain/
    prefixes:
      - /toolchain/
      - /lsp/
      - /building/
    pages:
      - { title: "命令行工具", url: /toolchain/ }
      - { title: "LSP 语言服务器", url: /lsp/ }
      - { title: "从源码构建", url: /building/ }

  - title: "版本"
    landing: /versions/
    prefixes:
      - /versions/
    pages:
      - { title: "版本历史", url: /versions/ }
